<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANG_Toolbox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Content -->
  <main class="content">

    <!-- Green Null + Anchor Point -->
    <div class="tool-row">

      <button class="null-btn" id="btn-create-green-null">
        <svg class="null-btn__icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="10" y1="6" x2="10" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="6" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="null-btn__label">Null</span>
      </button>

      <div class="ap-widget">

        <button class="ap-btn" data-h="0"   data-v="0"   title="Top Left">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(315 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>
        <button class="ap-btn" data-h="0.5" data-v="0"   title="Top Center">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(0 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>
        <button class="ap-btn" data-h="1"   data-v="0"   title="Top Right">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(45 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>

        <button class="ap-btn" data-h="0"   data-v="0.5" title="Middle Left">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(270 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>
        <button class="ap-btn ap-btn--center" data-h="0.5" data-v="0.5" title="Center">
          <svg class="ap-icon" viewBox="0 0 16 16" fill="none">
            <line x1="8" y1="3" x2="8" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="ap-btn" data-h="1"   data-v="0.5" title="Middle Right">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(90 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>

        <button class="ap-btn" data-h="0"   data-v="1"   title="Bottom Left">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(225 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>
        <button class="ap-btn" data-h="0.5" data-v="1"   title="Bottom Center">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(180 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>
        <button class="ap-btn" data-h="1"   data-v="1"   title="Bottom Right">
          <svg class="ap-icon" viewBox="0 0 16 16"><g transform="rotate(135 8 8)"><path d="M8,3 L12,10.5 L4,10.5 Z"/></g></svg>
        </button>

      </div>
    </div>

    <!-- Color Picker -->
    <div class="cp-area">

      <div class="cp-card">

        <!-- 메인 행: [정사각 피커] [미리보기+hex 오버레이] [RGB/HSB] -->
        <div class="cp-top">

          <!-- Color Picker (정사각, 좌측) — 스포이드(피펫) -->
          <button class="cp-pick-btn" id="cp-eyedropper-btn" title="Color Picker" aria-label="Color Picker">
            <svg class="cp-pick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19.4 4.6a2.1 2.1 0 0 0-3 0l-2 2 3 3 2-2a2.1 2.1 0 0 0 0-3z"/>
              <path d="M14.4 8.6 6 17a2 2 0 0 0-.5.9L4.6 21l3.1-.9a2 2 0 0 0 .9-.5l8.4-8.4"/>
            </svg>
          </button>

          <!-- 미리보기 색상 + hex 오버레이 (반투명 스트립 위 흰색) -->
          <div class="cp-preview" id="cp-preview">
            <button class="cp-icon-btn" id="cp-copy-btn" title="클립보드에 복사" aria-label="hex 복사">
              <svg class="cp-btn-icon" viewBox="0 0 16 16" fill="none">
                <rect x="5" y="2" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M3 5v8a1 1 0 001 1h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="cp-hex-overlay">
              <span class="cp-hash">#</span>
              <span class="cp-hex-val" id="cp-hex-val">4CAF50</span>
            </div>
          </div>

          <!-- 값: R·G·B / H·S·B (가로 꽉 채움) -->
          <div class="cp-values">
            <div class="cp-rgb-row">
              <span class="cp-rgb-chip"><span class="cp-chip-key">R</span><b class="cp-chip-val" id="cp-r">76</b></span>
              <span class="cp-rgb-chip"><span class="cp-chip-key">G</span><b class="cp-chip-val" id="cp-g">175</b></span>
              <span class="cp-rgb-chip"><span class="cp-chip-key">B</span><b class="cp-chip-val" id="cp-b">80</b></span>
            </div>
            <div class="cp-rgb-row">
              <span class="cp-rgb-chip"><span class="cp-chip-key">H</span><b class="cp-chip-val" id="cp-hue">123</b></span>
              <span class="cp-rgb-chip"><span class="cp-chip-key">S</span><b class="cp-chip-val" id="cp-sat">57</b></span>
              <span class="cp-rgb-chip"><span class="cp-chip-key">B</span><b class="cp-chip-val" id="cp-bri">69</b></span>
            </div>
          </div>

        </div>

        <!-- 히스토리 (카드 안) -->
        <div class="cp-history-row">
          <div class="cp-history" id="cp-history"></div>
          <button class="cp-clear-btn" id="cp-clear-btn" title="히스토리 초기화">
            <svg viewBox="0 0 12 12" fill="none" width="10" height="10">
              <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="10" y1="2" x2="2"  y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- 피커 상태 (평소 빈 줄) -->
        <div class="cp-status" id="cp-status"></div>

      </div>

      <!-- 폴백용 숨겨진 네이티브 컬러 인풋 -->
      <input type="color" id="cp-color-input"
             style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:none;padding:0;">

    </div>

  </main>

  <!-- Status Bar -->
  <footer class="statusbar">
    <span class="statusbar__text" id="status-text">Ready</span>
    <span class="statusbar__credit">만든사람 : 방모씨</span>
  </footer>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
